# golangci-lint v2 configuration
# Pragmatic configuration that catches bugs while allowing legacy code

version: "2"

run:
  timeout: 15m
  concurrency: 4

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/fulminate-io/knowledge

linters:
  default: none
  enable:
    # Core - essential for catching bugs
    - govet          # Go vet checks
    - ineffassign    # Detect ineffective assignments
    - staticcheck    # Staticcheck (go vet on steroids)
    - errcheck       # Check for unchecked errors
    - errchkjson     # Check errors in JSON marshalling/unmarshalling
    - modernize      # Suggest modern Go constructs
    - spancheck      # Detect unsafe uses of strings/bytes slices

    # Security - always enabled
    - gosec          # Security issues

    # Bugs - catch common bugs
    - bodyclose      # Check HTTP response body is closed
    - nilerr         # Detect nil error comparisons

    # Type safety - prevent runtime panics
    - forcetypeassert  # Detect type assertions without ok check

    # Style
    - misspell       # Fix common misspellings
    - revive         # Style and linting
    - sloglint       # Structured logging best practices
    - unconvert      # Detect redundant type conversions
    - whitespace     # Check for trailing whitespace
    - testifylint    # Testify best practices

    # Deadcode detection
    - unused         # Unused funcs, types, consts, vars
    - unparam        # Unused function parameters

    # Complexity
    - gocognit       # Cognitive complexity
    - nestif         # Deeply nested ifs
    - funlen         # Function length

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false

    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow

    staticcheck:
      checks:
        - "all"
        - "-SA1019"  # Allow deprecated for now
        - "-ST1003"  # Package naming
        - "-QF1003"  # Switch suggestions (style preference)

    gosec:
      excludes:
        - G101  # Hardcoded credentials - false positive for token header names
        - G104  # Covered by errcheck
        - G115  # Integer overflow conversion - false positive for protobuf int32 fields
        - G204  # Subprocess args validated (filepath.Clean + os.Stat) before use; exec.LookPath used for non-constant commands
        - G304  # File path taint (common in CLIs)
        - G404  # HNSW level-generation and test data use a PRNG seeded from crypto/rand; crypto/rand directly would be impractically slow

    misspell:
      locale: US
      ignore-rules:
        - cancelled  # British spelling used consistently in codebase

    unparam:
      check-exported: false  # Skip exported funcs (interface impls)

    gocognit:
      min-complexity: 30

    nestif:
      min-complexity: 4

    funlen:
      lines: 80
      statements: 50

    revive:
      rules:
        - name: var-naming
          disabled: false
          arguments:
            - ["ID", "URL", "HTTP", "API", "JSON", "XML", "HTML", "UUID", "SQL", "SSH", "TCP", "UDP", "IP", "DNS", "TLS", "EOF", "GUID", "OK", "ID"]
            - []

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    paths:
      - vendor
      - build
      - cmd/knowledge/internal/bench
      - cmd/dead
      - cmd/smoke-llm
    rules:
      # Relax rules for test files
      - path: _test\.go
        linters:
          - errcheck
          - govet
          - staticcheck
          - revive
          - nestif
          - gocognit
          - funlen
          - forcetypeassert
      # Exclude generated files
      - path: ".*_gen\\.go"
        linters:
          - all

output:
  formats:
    text:
      path: stdout
      colors: true
